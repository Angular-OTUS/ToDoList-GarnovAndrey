<div class="container">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar__logo">
        <div class="logo">
          <img src="assets/logo.svg" [alt]="'APP.ALT-LOG' | translate" >
        </div>
        <span class="logo__text">Keen</span>
      </div>
      <div class="change-lang">
        <button class="button__change-lang" (click)="switchLang()">{{btnLang}}</button>
      </div>
    </div>
    <div class="sidebar__menu">
      <ul>
        <li class="menu" routerLink="backlog" routerLinkActive="menu-active">
          <div class="menu-container">
            <div class="menu-dec"></div>
            <div class="menu-icon">
              <img src="assets/list-icon.svg" [alt]="'APP.ALT-ICON-LIST' | translate">
            </div>
            <span class="menu-text">{{ 'APP.BACKLOG' | translate}}</span>
          </div>
        </li>
        <li class="menu" routerLink="board" routerLinkActive="menu-active">
          <div class="menu-container">
            <div class="menu-dec"></div>
            <div class="menu-icon">
              <img src="assets/board-icon.svg" [alt]="'APP.ALT-ICON-BOARD' | translate">
            </div>
            <span class="menu-text">{{ 'APP.BOARD' | translate}}</span>
          </div>
        </li>
      </ul>
    </div>
  </div>
  <div class="content-conteiner">
    <router-outlet />
  </div>
</div>
