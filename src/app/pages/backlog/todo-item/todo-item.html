<div class=sidebar (dblclick)="editTask()">
  @if(!editTaskFlag){
    <div class="description-container">
      <h2>{{selectedTask?.title}}</h2>
      <h3>{{ "TODO-ITEM.DESCRIPTION" | translate }}</h3>
      <div class="description-content">
        <span>{{selectedTask?.description}}</span>
      </div>
    </div>
    <app-button-component class="button__delete" (onClick)="delTask(selectedTask!.id)">{{ "TODO-ITEM.BUTTON.DELETE" | translate }}</app-button-component>
  }
  @else {
    <div class="editform">
      <div class="edit-fields">
        <textarea class="edit-task-field" [placeholder]="'TODO-ITEM.TEXTAREA.PLACEHOLDER' | translate" cols="30" rows="3" [(ngModel)]="changingTitle"></textarea>
        <h3>{{ "TODO-ITEM.DESCRIPTION" | translate }}</h3>
        <textarea class="edit-task-field" [(ngModel)]="changingDescription" cols="30" rows="10"></textarea>
      </div>
      <div class="edit-btn">
        <app-button-component class="button__add" (onClick)="saveChangesTask()">{{ "TODO-ITEM.BUTTON.SAVE" | translate }}</app-button-component>
      </div>
    </div>
  }
</div>
