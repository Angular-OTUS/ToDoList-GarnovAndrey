<app-toast />
<div class="add-task">
  <div class="add-task__title">
    <input class="add-task__input" [placeholder]="'TODO-CREATE-ITEM.INPUT.PLACEHOLDER' | translate " [(ngModel)]="newTaskText" >
    <app-button-component [appTooltip]="'TODO-CREATE-ITEM.BUTTON.TOOLTIP' | translate" class="button__add" [disabledState]="!newTaskText" (onClick)="addTask()">{{ "TODO-CREATE-ITEM.BUTTON.ADD" | translate }}</app-button-component>
  </div>
  @if(newTaskText){
    <div class="add-task__description">
      <textarea class="task__description" [(ngModel)]="newTaskTextDescription" cols="30" rows="10"></textarea>
    </div>
  }
</div>
